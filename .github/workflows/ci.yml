name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # PyTorch is pinned here and installed from the CPU-only index. The default build pulls in
  # several gigabytes of GPU libraries that CI never uses. Everything else is pinned in
  # requirements-lock.txt (regenerate it with scripts/update_lock.sh).
  TORCH_VERSION: "2.15.0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -m "not slow and not data"
